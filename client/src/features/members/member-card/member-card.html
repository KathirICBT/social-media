@if (member(); as member) {
<div routerLink="/members/{{ member.id }}" class="group relative w-full cursor-pointer">
  <div
    class="absolute -inset-1 rounded-2xl bg-gradient-to-r from-gray-300 to-slate-400 opacity-20 blur-md transition duration-500 group-hover:opacity-40"
  ></div>

  <div
    class="relative aspect-[4/5] overflow-hidden rounded-xl bg-slate-900 ring-1 ring-slate-900/5"
  >
    <img
      src="{{ member?.imageUrl || '/user.png' }}"
      alt="{{ member.displayName }}"
      class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-110"
    />

    <button
      (click)="toggleLike($event)"
      class="absolute top-1 right-1 z-40 btn btn-ghost btn-circle"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        [attr.fill]="hasLiked() ? 'red' : 'none'"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
        />
      </svg>
    </button>

    <div class="absolute bottom-0 left-0 right-0 p-3">
      <div
        class="relative overflow-hidden rounded-lg border border-white/10 bg-black/20 px-3 py-2 backdrop-blur-md transition-all duration-300 group-hover:bg-black/40 group-hover:-translate-y-1"
      >
        <div class="flex items-center justify-between text-white">
          <div class="overflow-hidden pr-2">
            <h3 class="text-sm font-bold truncate tracking-wide text-white drop-shadow-sm">
              {{ member.displayName }}
            </h3>
            <p class="text-[10px] text-gray-200 flex items-center gap-1 truncate opacity-90">
              {{ member.city }}
            </p>
          </div>
          <div class="shrink-0">
            <span class="text-lg font-bold">{{ member.dateOfBirth | age }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
}
