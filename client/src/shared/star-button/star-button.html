<button (click)="onClick($event)" [disabled]="disabled()" class="z-50 cursor-pointer group">
  <div
    class="flex items-center justify-center w-10 h-10 rounded-full transition-all duration-300 group-hover:scale-110 group-hover:rotate-6 bg-black/40 backdrop-blur-md shadow-lg border border-white/20"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      [attr.fill]="seleted() ? 'currentColor' : 'none'"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      [class.text-yellow-300]="seleted()"
      [class.stroke-yellow-300]="seleted()"
      class="w-7 h-7 stroke-2 transition-all duration-300 drop-shadow-[0_0_6px_rgba(255,255,0,0.6)]"
      [class.scale-125]="seleted()"
      [class.rotate-12]="seleted()"
      [class.text-white]="!seleted()"
      [class.stroke-white]="!seleted()"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"
      />
    </svg>
  </div>
</button>
