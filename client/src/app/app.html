<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
  <h1 class="text-3xl text-red-500 font-bold underline">{{ title() }}</h1>
  <ul class="list">
    @for (member of members(); track member.id) {
    <li class="list-row items-center">
      <img src="/user.png" alt="user avatar" class="size-12 rounded-box mr-4" />
      <div>
        <div class="font-bold">{{ member.displayName }}</div>
        <div class="text-sm opacity-50">{{ member.email }}</div>
      </div>
    </li>
    }
  </ul>
</div>
